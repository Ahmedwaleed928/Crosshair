name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show error
        if: failure()
        run: |
          echo "=== ERROR LINES ==="
          grep -n -i -E "error|failed|exception|not found|no module" build.log | grep -v -i "deprecated" | tail -40
          echo "=== LAST 40 LINES ==="
          tail -40 build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: crosshair-apk
          path: bin/*.apk
